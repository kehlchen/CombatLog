# ============================================================
#  CombatLog – Konfiguration
#  Texte nutzen MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  Nach Änderungen: /combatlog reload
# ============================================================

combat:
  duration: 15              # Dauer des Combat-Tags in Sekunden
  refresh-on-hit: true      # true = jeder Treffer setzt den Timer wieder auf voll
  tag-victim: true          # Angegriffener kommt in Combat
  tag-attacker: true        # Angreifer kommt ebenfalls in Combat
  min-damage: 0.0           # Mindestschaden fürs Taggen (z.B. 0.1 ignoriert Schneebälle/Eier)
  ignore-creative: true     # Creative/Spectator lösen keinen Combat aus (beide Seiten)
  ignore-npcs: true         # Spieler mit "NPC"-Metadata (z.B. Citizens) ignorieren
  untag-killer-on-kill: true  # Wer seinen Gegner tötet, ist sofort wieder out of combat
  worlds:
    mode: BLACKLIST         # BLACKLIST = in diesen Welten KEIN Combat | WHITELIST = NUR in diesen Welten
    list: []                # z.B. [lobby, spawn]

logout:
  punish: true              # Strafe beim Logout im Combat
  kill: true                # Spieler wird getötet (Items droppen je nach keepInventory-Gamerule)
  # Welche Quit-Gründe bestraft werden: DISCONNECTED, TIMED_OUT, KICKED, ERRONEOUS_STATE
  # (KICKED nicht bestrafen = Admin-Kicks sind sicher; TIMED_OUT = Verbindungsabbruch/Crash)
  reasons: [DISCONNECTED, TIMED_OUT]
  hide-death-message: true  # Vanilla-Todesnachricht unterdrücken (die quit-message ersetzt sie)
  lightning: true           # Blitz-Effekt (ohne Schaden) an der Logout-Stelle
  quit-message: "<red><player> <gray>hat sich im Kampf ausgeloggt und wurde getötet!"  # leer = Standard-Quit-Nachricht
  # Konsolen-Commands, die beim Combat-Log ausgeführt werden. Platzhalter: %player%, %opponent%
  commands: []
  # Beispiel: ["eco take %player% 100", "broadcast %player% ist ein Combat-Logger"]

commands:
  mode: ALL                 # ALL = alle Commands gesperrt (außer "allowed") | BLACKLIST = nur "blocked" gesperrt
  allowed: []               # Ausnahmen im Modus ALL, z.B. [msg, r]  (Aliase werden automatisch erkannt)
  blocked: [home, spawn, tpa, tpahere, tpaccept, warp, back, tp, rtp, sethome, kit, ec, enderchest]

restrictions:
  # true = im Combat gesperrt, false = erlaubt
  disable-flight: true      # Fliegen (z.B. durch Plugins) deaktivieren, danach wiederherstellen
  disable-elytra: true      # Elytra-Gleiten verhindern
  block-ender-pearls: true  # Enderperlen können nicht benutzt werden (Perle bleibt im Inventar)
  block-chorus-fruit: true  # Chorusfrüchte können nicht gegessen werden
  block-portals: false      # Nether-/End-Portale und End-Gateways
  # Weitere gesperrte Teleport-Ursachen (optional), z.B. [COMMAND, PLUGIN, SPECTATE]
  blocked-teleport-causes: []

display:
  action-bar:
    enabled: true
    format: "<red>⚔ Combat <gray>» <white><time>s"
  boss-bar:
    enabled: false
    format: "<red>Combat: <white><time>s"
    color: RED              # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    overlay: PROGRESS       # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
  sounds:
    start: "minecraft:entity.arrow.hit_player"   # leer = kein Sound
    end: "minecraft:entity.player.levelup"

# Platzhalter: <player>, <opponent>, <time>. Leerer Text = Nachricht wird nicht gesendet.
messages:
  prefix: "<dark_gray>[<red>Combat<dark_gray>] "
  combat-start: "<red>Du bist jetzt im Kampf mit <white><opponent><red>! Logge dich nicht aus (<time>s)."
  combat-end: "<green>Du bist nicht mehr im Kampf und kannst dich sicher ausloggen."
  command-blocked: "<red>Im Kampf kannst du keine Commands benutzen! <gray>(noch <time>s)"
  teleport-blocked: "<red>Teleportieren ist im Kampf nicht erlaubt!"
  elytra-blocked: "<red>Elytra und Fliegen sind im Kampf deaktiviert!"
  usage: "<gray>Benutzung: <white>/combatlog <reload|status|tag|untag|list>"
  reloaded: "<green>Konfiguration neu geladen."
  player-not-found: "<red>Spieler nicht gefunden."
  status-in-combat: "<white><player> <gray>ist im Combat (<time>s)."
  status-not-in-combat: "<white><player> <gray>ist nicht im Combat."
  admin-tagged: "<white><player> <gray>wurde für <time>s in Combat gesetzt."
  admin-untagged: "<white><player> <gray>wurde aus dem Combat entfernt."
  list-header: "<gray>Spieler im Combat: <white><time>"
  list-entry: "<gray> - <white><player> <gray>(<time>s)"
  list-empty: "<gray>Aktuell ist niemand im Combat."
