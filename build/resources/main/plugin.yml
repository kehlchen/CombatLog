name: CombatLog
version: '1.0.0'
main: com.example.combatlog.CombatLogPlugin
api-version: '26.3'
description: Combat-Tag mit Tod beim Logout, Command-Sperre und vielen Optionen
authors: [CombatLog]

commands:
  combatlog:
    description: CombatLog verwalten
    usage: /<command> <reload|status|tag|untag|list>
    aliases: [combat]
    permission: combatlog.admin

permissions:
  combatlog.admin:
    description: Zugriff auf /combatlog
    default: op
  combatlog.bypass.tag:
    description: Wird nie in Combat gesetzt
    default: false
  combatlog.bypass.logout:
    description: Keine Strafe beim Logout im Combat
    default: false
  combatlog.bypass.commands:
    description: Darf im Combat Commands benutzen
    default: false
  combatlog.bypass.restrictions:
    description: Darf im Combat fliegen, Elytra nutzen und teleportieren
    default: false
  combatlog.bypass.*:
    description: Alle Bypass-Rechte
    default: false
    children:
      combatlog.bypass.tag: true
      combatlog.bypass.logout: true
      combatlog.bypass.commands: true
      combatlog.bypass.restrictions: true
